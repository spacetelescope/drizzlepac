name: PRs

# Trigger a regression test run in spacetelescope/RegressionTests when a
# review is requested on a pull request. See
# https://github.com/spacetelescope/RegressionTests/blob/main/docs/running_regression_tests_from_another_repository.md
#
# NOTE: this only dispatches the regression test run; it reports success once
# the dispatch request is accepted and does NOT track the status or results of
# the regression tests themselves.

on:
  # `pull_request_target` (instead of `pull_request`) is required so that
  # `secrets.REGTEST_API_TOKEN` is available for pull requests from forks.
  # This is safe here because this workflow never checks out or runs any code
  # from the pull request; it only sends its repo/ref metadata.
  pull_request_target:
    types:
      - review_requested
    branches:
      - main

jobs:
  regression_tests:
    name: dispatch regression tests
    runs-on: ubuntu-latest
    steps:
      - name: trigger regression test run
        run: |
          curl --fail --request POST https://api.github.com/repos/spacetelescope/RegressionTests/actions/workflows/drizzlepac.yml/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -H "User-Agent: SpaceTelescopeGithubBot" \
            -H "Authorization: Bearer ${{ secrets.REGTEST_API_TOKEN }}" \
            --data '{ "ref": "main", "inputs": { "git_repository": "${{ github.event.pull_request.head.repo.full_name }}", "git_ref": "${{ github.event.pull_request.head.ref }}" } }'
